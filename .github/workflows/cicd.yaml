name: Python Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB 1 - SECRETS SCANNING
  # ============================================================
  secrets-scan:
    name: Gitleaks - Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sSL "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" | grep -Po '"tag_name": "v\K[^"]*')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --report-format sarif --report-path gitleaks-report.sarif --exit-code 1 --redact --verbose

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.sarif
          retention-days: 30

  # ============================================================
  # JOB 2 - LINT (RUFF) + UNIT TEST (PYTEST) - MATRIX
  # ============================================================
  lint-and-test:
    name: Lint & Test - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [secrets-scan]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
            context: ./src/emailservice
          - name: recommendationservice
            context: ./src/recommendationservice
          - name: loadgenerator
            context: ./src/loadgenerator
          - name: shoppingassistantservice
            context: ./src/shoppingassistantservice
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: ${{ matrix.service.context }}
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt --quiet; fi

      - name: Run Ruff Lint
        working-directory: ${{ matrix.service.context }}
        run: ruff check . --output-format=github

      - name: Run Ruff Format Check
        working-directory: ${{ matrix.service.context }}
        run: ruff format --check .

      - name: Run Pytest with Coverage
        working-directory: ${{ matrix.service.context }}
        run: |
          python -m pytest --cov=. --cov-report=xml:coverage.xml --cov-report=html:coverage_html --junitxml=pytest-report.xml || echo "⚠️ No tests found"

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service.name }}-${{ github.sha }}
          path: |
            ${{ matrix.service.context }}/coverage.xml
            ${{ matrix.service.context }}/coverage_html
            ${{ matrix.service.context }}/pytest-report.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # JOB 3 - DOCKERFILE LINTING (HADOLINT) - MATRIX
  # ============================================================
  hadolint:
    name: Hadolint - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [secrets-scan]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
            dockerfile: ./src/emailservice/Dockerfile
          - name: recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile
          - name: loadgenerator
            dockerfile: ./src/loadgenerator/Dockerfile
          - name: shoppingassistantservice
            dockerfile: ./src/shoppingassistantservice/Dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service.dockerfile }}
          format: sarif
          output-file: hadolint-${{ matrix.service.name }}.sarif
          no-fail: true

      - name: Upload Hadolint SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-${{ matrix.service.name }}.sarif
          category: hadolint-${{ matrix.service.name }}

      - name: Upload Hadolint Report
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report-${{ matrix.service.name }}-${{ github.sha }}
          path: hadolint-${{ matrix.service.name }}.sarif
          retention-days: 30

  # ============================================================
  # JOB 4 - DOCKER BUILD (BUILDX) - MATRIX
  # ============================================================
  docker-build:
    name: Build - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [lint-and-test, hadolint]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
            context: ./src/emailservice
            dockerfile: ./src/emailservice/Dockerfile
          - name: recommendationservice
            context: ./src/recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile
          - name: loadgenerator
            context: ./src/loadgenerator
            dockerfile: ./src/loadgenerator/Dockerfile
          - name: shoppingassistantservice
            context: ./src/shoppingassistantservice
            dockerfile: ./src/shoppingassistantservice/Dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.service.name }}
          key: docker-${{ runner.os }}-${{ matrix.service.name }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-${{ matrix.service.name }}-

      - name: Build Docker Image (load, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service.name }}-new,mode=max

      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.service.name }}
          mv /tmp/.buildx-cache-${{ matrix.service.name }}-new /tmp/.buildx-cache-${{ matrix.service.name }}

      - name: Save Docker Image as Tarball
        run: |
          mkdir -p /tmp/images
          docker save ${{ matrix.service.name }}:${{ github.sha }} -o /tmp/images/${{ matrix.service.name }}.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service.name }}-${{ github.sha }}
          path: /tmp/images/${{ matrix.service.name }}.tar
          retention-days: 7

  # ============================================================
  # JOB 5 - TRIVY IMAGE SCAN - MATRIX
  # ============================================================
  trivy-scan:
    name: Trivy - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
          - name: recommendationservice
          - name: loadgenerator
          - name: shoppingassistantservice
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.service.name }}-${{ github.sha }}
          path: /tmp/images

      - name: Load Docker Image
        run: docker load -i /tmp/images/${{ matrix.service.name }}.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy - Fail Gate (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.name }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service.name }}-${{ github.sha }}
          path: trivy-results-${{ matrix.service.name }}.sarif
          retention-days: 30

  # ============================================================
  # JOB 6 - SBOM GENERATION (SYFT) - MATRIX
  # ============================================================
  sbom-generation:
    name: Syft SBOM - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
          - name: recommendationservice
          - name: loadgenerator
          - name: shoppingassistantservice
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.service.name }}-${{ github.sha }}
          path: /tmp/images

      - name: Load Docker Image
        run: docker load -i /tmp/images/${{ matrix.service.name }}.tar

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.service.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service.name }}-${{ github.sha }}
          path: sbom-${{ matrix.service.name }}.spdx.json
          retention-days: 90

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: sbom-${{ matrix.service.name }}.spdx.json

  # ============================================================
  # JOB 7 - DOCKER HUB PUSH - MATRIX
  # ============================================================
  docker-push:
    name: Push - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [trivy-scan, sbom-generation]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: emailservice
            context: ./src/emailservice
            dockerfile: ./src/emailservice/Dockerfile
          - name: recommendationservice
            context: ./src/recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile
          - name: loadgenerator
            context: ./src/loadgenerator
            dockerfile: ./src/loadgenerator/Dockerfile
          - name: shoppingassistantservice
            context: ./src/shoppingassistantservice
            dockerfile: ./src/shoppingassistantservice/Dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/microservices-demo-${{ matrix.service.name }}:buildcache,mode=max

      - name: Verify Push
        run: |
          echo "✅ ${{ matrix.service.name }} pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

