name: Debug Find Dockerfiles

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show full repo structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          echo "=== ALL DOCKERFILES IN REPO ==="
          find . -name "Dockerfile" | sort
          echo ""
          echo "=== FOLDER TREE (3 levels) ==="
          find . -type d -maxdepth 3 | grep -v ".git" | sort
