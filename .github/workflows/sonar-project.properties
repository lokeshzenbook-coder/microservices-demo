# Global Repository Configuration
sonar.organization=your_sonarcloud_organization_key
sonar.projectKey=your_main_monorepo_project_key
sonar.projectName=Microservices Demo Monorepo

# Define all your microservices as modules
sonar.modules=adservice,cartservice,checkoutservice,currencyservice,emailservice,frontend,loadgenerator,paymentservice,productcatalogservice,recommendationservice,shippingservice,shoppingassistantservice

# Base path for modules (optional, tells Sonar they live in /src)
# If your folders are directly in the root, remove this line.
sonar.projectBaseDir=src

# Individual Module Configurations
adservice.sonar.sources=adservice
cartservice.sonar.sources=cartservice/src
checkoutservice.sonar.sources=checkoutservice
currencyservice.sonar.sources=currencyservice
emailservice.sonar.sources=emailservice
frontend.sonar.sources=frontend
loadgenerator.sonar.sources=loadgenerator
paymentservice.sonar.sources=paymentservice
productcatalogservice.sonar.sources=productcatalogservice
recommendationservice.sonar.sources=recommendationservice
shippingservice.sonar.sources=shippingservice
shoppingassistantservice.sonar.sources=shoppingassistantservice
